<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#00f0ff" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid lines -->
  <g opacity="0.08" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="480" y1="0" x2="480" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
  </g>

  <!-- Ambient Glow orbs -->
  <circle cx="280" cy="200" r="180" fill="#00f0ff" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />

  <!-- Main Container Card -->
  <rect x="80" y="60" width="1120" height="600" rx="20" fill="#111827" fill-opacity="0.85" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#cardGlow)" />
  
  <!-- Header Bar -->
  <rect x="80" y="60" width="1120" height="65" rx="20" fill="#161f30" fill-opacity="0.9" />
  <circle cx="120" cy="92" r="7" fill="#ef4444" />
  <circle cx="145" cy="92" r="7" fill="#f59e0b" />
  <circle cx="170" cy="92" r="7" fill="#10b981" />
  
  <text x="210" y="98" fill="#e2e8f0" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="17" font-weight="600" letter-spacing="1">
    EXPENSE_TRACKER.PY <tspan fill="#64748b" font-weight="400">— PYTHON FINANCIAL ANALYTICS ENGINE</tspan>
  </text>
  
  <rect x="1010" y="78" width="150" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
  <text x="1085" y="97" fill="#22d3ee" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" text-anchor="middle">PYTHON 3.12 ACTIVE</text>

  <!-- Left Side: Terminal CLI & Code Logic -->
  <g transform="translate(120, 160)">
    <rect width="500" height="460" rx="14" fill="#090d16" stroke="rgba(0,240,255,0.2)" stroke-width="1" />
    <!-- Terminal Header -->
    <rect width="500" height="40" rx="14" fill="#0f172a" />
    <text x="20" y="26" fill="#38bdf8" font-family="'Fira Code', 'Courier New', monospace" font-size="14" font-weight="600">❯ suriya@dev: ~/python-expense-tracker $ python main.py</text>
    
    <!-- Code & Console Log -->
    <text x="25" y="75" fill="#10b981" font-family="'Fira Code', monospace" font-size="13">✔ Expense Database Initialized (In-Memory Structs)</text>
    <text x="25" y="105" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="13">----------------------------------------------------</text>
    <text x="25" y="135" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="14" font-weight="600">[1] Add Expense    [2] View Categories</text>
    <text x="25" y="165" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="14" font-weight="600">[3] Total Analytics [4] Filter &amp; Delete</text>
    <text x="25" y="195" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="13">----------------------------------------------------</text>
    
    <text x="25" y="235" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13">def calculate_summary(expenses: list[dict]) -> dict:</text>
    <text x="50" y="265" fill="#a855f7" font-family="'Fira Code', monospace" font-size="13">total_spent = sum(item['amount'] for item in expenses)</text>
    <text x="50" y="295" fill="#a855f7" font-family="'Fira Code', monospace" font-size="13">breakdown = defaultdict(float)</text>
    <text x="50" y="325" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="13">for item in expenses: breakdown[item['category']] += item['amount']</text>
    <text x="50" y="355" fill="#34d399" font-family="'Fira Code', monospace" font-size="13">return {'total': total_spent, 'categories': dict(breakdown)}</text>
    
    <!-- Active prompt pulse -->
    <text x="25" y="410" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="14">❯ Selected: Option [3] -> Computing Budget Metrics...</text>
    <rect x="460" y="398" width="8" height="16" fill="#00f0ff" opacity="0.9" />
  </g>

  <!-- Right Side: Analytics Dashboard Cards -->
  <g transform="translate(660, 160)">
    <!-- Stat 1: Total Spent -->
    <rect width="240" height="110" rx="12" fill="#131d2e" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="20" y="35" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="500">TOTAL EXPENDITURE</text>
    <text x="20" y="75" fill="#00f0ff" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">₹ 14,850.00</text>
    <text x="20" y="98" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="12">↓ 18% Under Monthly Budget</text>

    <!-- Stat 2: Active Entries -->
    <rect x="260" width="240" height="110" rx="12" fill="#131d2e" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="280" y="35" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="500">TRACKED TRANSACTIONS</text>
    <text x="280" y="75" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">48 Records</text>
    <text x="280" y="98" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="12">4 Custom Categories</text>

    <!-- Category Visual Bars -->
    <rect y="130" width="500" height="330" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="25" y="165" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600">Category Spending Distribution</text>
    
    <!-- Bar 1: Hardware & IoT Components -->
    <text x="25" y="205" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="13">Hardware &amp; IoT Components (45%)</text>
    <text x="430" y="205" fill="#00f0ff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">₹ 6,680</text>
    <rect x="25" y="215" width="450" height="10" rx="5" fill="#1e293b" />
    <rect x="25" y="215" width="202" height="10" rx="5" fill="url(#cyanPurple)" />

    <!-- Bar 2: Books & Learning Resources -->
    <text x="25" y="255" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="13">Books &amp; Courses (25%)</text>
    <text x="430" y="255" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">₹ 3,710</text>
    <rect x="25" y="265" width="450" height="10" rx="5" fill="#1e293b" />
    <rect x="25" y="265" width="112" height="10" rx="5" fill="url(#purplePink)" />

    <!-- Bar 3: Tech Subscriptions -->
    <text x="25" y="305" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="13">Cloud &amp; Development Tools (18%)</text>
    <text x="430" y="305" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">₹ 2,670</text>
    <rect x="25" y="315" width="450" height="10" rx="5" fill="#1e293b" />
    <rect x="25" y="315" width="81" height="10" rx="5" fill="url(#emeraldGrad)" />

    <!-- Bar 4: Daily Miscellaneous -->
    <text x="25" y="355" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="13">Project Prototyping (12%)</text>
    <text x="430" y="355" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">₹ 1,790</text>
    <rect x="25" y="365" width="450" height="10" rx="5" fill="#1e293b" />
    <rect x="25" y="365" width="54" height="10" rx="5" fill="#f59e0b" />

    <!-- Data structures badge -->
    <g transform="translate(25, 400)">
      <rect width="450" height="40" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="rgba(0,240,255,0.15)" stroke-width="1" />
      <text x="225" y="25" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">⚡ Built with Python Dictionaries, Lists &amp; Modular CRUD Functions</text>
    </g>
  </g>
</svg>
